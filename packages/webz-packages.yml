source: >-
  npm registry, PyPI, NuGet, RubyGems, Packagist, crates.io and the Webz.io GitHub organization
  (https://github.com/Webhose) — the org still carries the company's pre-rename Webhose.io name.
note: >-
  Every first-party client library ships from github.com/Webhose. Webz.io was formerly Webhose.io,
  which is why the GitHub organization and the older packages carry the Webhose name; the newer
  webzio-* packages are the same libraries renamed. CURRENCY IS THE HEADLINE FINDING: no first-party
  SDK has been published to any registry since 2022-12-26, while the API surface has since gained the
  News Search API, the Data Breaches API, the Firehose FH API and an MCP server — none of which any
  published SDK covers. The Ruby, Cocoa and PHP clients were never published to a registry at all and
  are GitHub-source-only.
