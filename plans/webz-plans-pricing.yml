notes:
- The published rate card is unusually granular for this market — per-call AND per-result pricing on
  each Open Web product — which makes cost genuinely predictable for an agent.
- Cyber and Data Breaches publish no price, no quota and no self-service signup, so an agent cannot
  plan spend on the dark-web half of the catalog from public information.
