summary: >-
  Webz.io splits its commercial surface in two. The Open Web APIs are self-service and publicly
  priced down to the individual call and result, including a genuinely free tier with no credit card.
  The Dark Web APIs — Cyber and Data Breaches — publish no price at all and are contact-only, which
  is why the plan list below carries both a fully-specified pay-as-you-go rate card and two tiers with
  price: null. Archive is priced separately on prepaid credits in the documentation.
