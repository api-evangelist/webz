summary: >-
  Webz.io meters two independent dimensions on every product: request RATE (about 1 request per
  second per token) and CREDITS (a monthly or prepaid quota consumed per request). Both exhaust into
  the same 429 status, which is the single most important runtime fact for an agent — a 429 here does
  not reliably mean "back off and retry", it may mean "you are out of credits and retrying will never
  succeed". Only the Data Breaches API disambiguates the two, via an X-RateLimit-Reason header.
limit_count: 8
rate_limits:
- scope: per-token, per-endpoint
  api: News / Blogs / Forums
  window: 1 second
  limit: 1
  burst: null
  status_on_exhaustion: 429
  body_on_exhaustion: '{ "detail": "rate limit exceeded" }'
  note: Documented as "by default about 1 request per second per endpoint". Contact support for a higher limit.
- scope: per-token
  api: Reviews
  window: 1 second
  limit: 1
  status_on_exhaustion: 429
  body_on_exhaustion: 'rate limit exceeded'
- scope: per-token
