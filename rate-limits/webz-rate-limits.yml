- scope: per-account, monthly
  api: News API Lite (free tier)
  window: 1 month
  limit: 1000
  note: Up to 1,000 API calls per month and 10 results per call. Non-commercial use only.
- scope: per-account, monthly quota
  api: Cyber / Reviews
  window: 1 month
  limit: null
  status_on_exhaustion: 429
  body_on_exhaustion: 'Too many requests: used X out of Y allowed in a month'
  note: Quota value is plan-specific and not published.
response_headers:
- name: X-WebHose-Requests-Left
  apis: [Cyber, Reviews]
  meaning: Remaining credit balance for the month.
- name: X-RateLimit-Reason
  apis: [Data Breaches]
  values: [rate_limit, insufficient_credits]
  meaning: >-
    The only header in the whole Webz.io surface that separates a retryable rate-limit 429 from a
    terminal insufficient-credits 429.
body_fields:
- name: requests_left
  apis: [News, Blogs, Forums, News Search]
  meaning: Remaining credit balance, returned in every successful response envelope.
- name: requestsLeft
  apis: [Cyber, Reviews, Data Breaches]
  meaning: Same value, camelCase on the older products.
- name: credits_used
  apis: [News Search]
  meaning: Credits consumed by this search.
credits:
- api: News / Blogs / Forums
  cost: 1 credit per request within the last 31 days; 2-4 credits for older windows
  segmentation_cost: 1 credit
  note: Every page of a paginated result set is a new request and costs credits.
- api: Cyber
  cost: 1 credit per search, segmentation, cached-page and image request
  quota: separate monthly Cyber quota
- api: Reviews
  cost: 1 credit per search and per segmentation request
- api: Data Breaches
  cost: 1 credit per request, including a request that returns 0 records and each Breach Catalog call
- api: News Search
  cost: reported per response in credits_used; failed requests are not charged
- api: Archive
  cost: 1 prepaid credit per post retrieved; charged on actual posts retrieved
  free_allowance: up to 100 posts from the last 30 days, once per account, costing no credits
missing_signals:
- No RateLimit-* (RFC 9331 / draft-ietf-httpapi-ratelimit-headers) headers on any product.
- No Retry-After header documented on any 429.
- No published numeric rate limit for the News Search API.
- Rate-limit 429 and out-of-credit 429 are indistinguishable on News/Blogs/Forums, Reviews and Cyber.
