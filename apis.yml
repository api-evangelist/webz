- name: Webz.io News Search MCP Server
  description: A first-party remote Model Context Protocol server that exposes Webz.io semantic news search to any MCP client. It ships one tool, news_search_by_webz, and every call runs a regular News Search API request against the caller's own Webz token, so the same credits and per-token rate limits apply. Authentication is a Bearer API token; Claude.ai and ChatGPT connect over OAuth, and the server publishes RFC 8414 authorization-server metadata and RFC 9728 protected-resource metadata (both probed 200 on 2026-08-27) with PKCE S256 and dynamic client registration. An anonymous tools/list returns 401 with a correctly-formed WWW-Authenticate challenge, which the provider documents as intentional.
  humanURL: https://news-search-mcp.webz.io
