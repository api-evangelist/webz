apis:
- name: Webz.io API
  description: 'Token-authenticated REST endpoints under https://api.webz.io covering seven products: News, Blogs and Forums (/api/news, /api/blogs, /api/forums plus /seg_api/* segmentation), Reviews (/reviewFilter, /reviewSeg), Cyber for deep and dark web (/cyberFilter, /cyberSeg, /dark-cache, /cyber-image), Data Breaches (/breaches, /breachCatalog), the Firehose FH API (/firehose), the semantic News Search API (POST /api/news/context), and the Archive order flow on app.webz.io. All are GET except News Search. Responses are a JSON envelope wrapping a result array plus an opaque next cursor. A free News API Lite tier gives 1,000 non-commercial calls a month.


    NO OpenAPI, Swagger, GraphQL, AsyncAPI, WSDL or apis.json contract is published. Re-probed 2026-08-27 across api.webz.io, webz.io and docs.webz.io: /openapi.json, /openapi.yaml, /swagger.json, /api-docs, /docs, /reference and /apis.json all 404. WHAT IS PUBLISHED and is new since the last pass: a first-party remote MCP server at https://news-search-mcp.webz.io/mcp with RFC 8414 and RFC 9728 discovery metadata (both probed 200), a provider-authored Agent Skill file, and a 20KB llms.txt indexing every docs page with a Markdown twin. The machine-readable surface here is agent-native rather than OpenAPI-native.'
