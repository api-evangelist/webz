domain_standards:
  market: web data / news data / threat intelligence / OSINT
  note: >-
    REWARD-ONLY check, recorded honestly. The news and threat-intelligence data markets do have
    candidate interchange standards — IPTC NewsML-G2 / rNews for news metadata, STIX/TAXII for threat
    intelligence exchange, MISP for breach and indicator sharing. Webz.io implements none of them as
    a transport or document format. The one genuine domain-standard signature in the contract is the
    IPTC subject taxonomy used for topic classification, and it is a partial, provider-flavoured use.
  signatures:
  - id: iptc-subject-taxonomy
    standard: IPTC Media Topics / IPTC subject codes
    conforms: partial
    where: >-
      The topics field on every news post is documented as "Detected IPTC level 2 and 3 topics,
      formatted as Category->topic", and the News Search category filter enumerates the 17
      top-level IPTC-style news categories (Arts, Culture and Entertainment; Crime, Law and Justice;
      Disaster and Accident; Economy, Business and Finance; Education; Environment; Health; Human
      Interest; Labor; Lifestyle and Leisure; Politics; Religion and Belief; Science and Technology;
      Social Issue; Sport; War, Conflict and Unrest; Weather).
    evidence:
    - https://docs.webz.io/docs/webz/news-api-post-fields
    - https://docs.webz.io/docs/webz/topics-reference
    - https://docs.webz.io/docs/webz/news-search-api-skill
    deviation: >-
      Values are emitted as a provider-specific "Category->topic" string rather than IPTC medtop
      concept URIs or QCodes, so a consumer that already speaks IPTC still needs a mapping layer.
  - id: stix-taxii
    standard: STIX 2.1 / TAXII 2.1
    conforms: false
    note: >-
      The Cyber and Data Breaches APIs are threat-intelligence products delivered as bespoke JSON.
      No STIX bundle output, no TAXII collection endpoint, and no mapping table is published — a
      SOC that already ingests STIX needs a bespoke connector for Webz.io.
  - id: misp
    standard: MISP core format
    conforms: false
  - id: newsml-g2
    standard: IPTC NewsML-G2
    conforms: false
  - id: iso3166
    standard: ISO 3166-1 alpha-2
    conforms: true
    where: >-
      The News Search country filter is documented as ISO-2 uppercase codes (US, GB, DE, IL) and
      thread.country carries a source country code.
    evidence: https://docs.webz.io/docs/webz/news-search-api-filters
  - id: iso8601
    standard: ISO 8601
    conforms: true
    where: published, crawled and updated are documented as ISO 8601 timestamps on every post.
    evidence: https://docs.webz.io/docs/webz/news-api-post-fields
    deviation: >-
      Request-side time parameters (ts, crawled_from, breach_from) are Unix epoch milliseconds, not
      ISO 8601, so the request and response speak different time formats.
  - id: ndjson
    standard: Newline-delimited JSON
    conforms: true
    where: Archive datasets are delivered as NDJSON inside a ZIP; ndjson is the only accepted format value.
    evidence: https://docs.webz.io/docs/webz/archive-output-format
