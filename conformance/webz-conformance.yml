summary: >-
  Webz.io's standards posture is bimodal. Everything the company built around its MCP server is
  standards-conformant and was verified live — RFC 8414, RFC 9728, PKCE, dynamic client registration,
  MCP itself, llms.txt. Everything on the original REST surface predates that effort and conforms to
  nothing: no OpenAPI, no RFC 9457 errors, no RFC 9116 security.txt, no RFC 8594 sunset headers, no
  standard rate-limit headers. The corporate compliance layer (SOC 2, ISO 27001, GDPR, CCPA) is
  separately published and real.
