method: searched
source: https://docs.webz.io/docs/webz/news-search-api-mcp
name: Webz.io News Search MCP
description: A first-party remote MCP server that exposes Webz.io semantic news search to any MCP client.
  It ships exactly one tool, news_search_by_webz, and every call runs a regular News Search API request
  against the caller's own Webz token, so the same credits and per-token rate limits apply.
deployment:
  mode: remote
  endpoint: https://news-search-mcp.webz.io/mcp
  auth: oauth
  verified: probed
  probe_prior: (never probed)
  probe: gated
  probe_why: RFC 9728 challenge on the MCP path only
  checked: '2026-09-11'
  source: claimed-backlog re-probe 2026-09-11
transport: streamable-http
landing_page: https://news-search-mcp.webz.io
docs: https://docs.webz.io/docs/webz/news-search-api-mcp
authentication:
  primary: 'Bearer token — the caller''s Webz.io API token, sent as: Authorization: Bearer <token>'
  oauth:
    supported: true
    note: Claude.ai and ChatGPT connect over OAuth. The provider's documented flow is to leave Client
      ID and Secret empty and paste the Webz token on the authorize page, so the OAuth layer is a wrapper
      over the same API token rather than a separate credential.
    authorization_server: https://news-search-mcp.webz.io/
    metadata: https://news-search-mcp.webz.io/.well-known/oauth-authorization-server
    protected_resource_metadata: https://news-search-mcp.webz.io/.well-known/oauth-protected-resource/mcp
    scopes_supported:
    - mcp
    grant_types_supported:
    - authorization_code
    - refresh_token
    code_challenge_methods_supported:
    - S256
    dynamic_client_registration: https://news-search-mcp.webz.io/register
tools:
- name: news_search_by_webz
  description: Search global news by natural-language topic or question and return matching articles with
    excerpts.
  status: published
  source: https://docs.webz.io/docs/webz/news-search-api-mcp
  backing_api: Webz.io News Search API (POST https://api.webz.io/api/news/context)
  parameters:
  - name: query
    required: true
    description: Natural-language topic or question. Max 750 characters / 100 words.
  - name: k
    default: 10
    description: Articles to return, 1-50.
  - name: days
    default: 7
    description: How many days back to search.
  - name: allow_all_dates
    default: false
    description: Search the full coverage window instead of days.
  - name: domain
    description: Only these source domains, e.g. cnn.com, yahoo.com.
  - name: exclude_domain
    description: Skip these source domains. A domain cannot appear in both lists.
  - name: language
    description: Full language names — english, chinese, hebrew, french, spanish, german, arabic, russian,
      japanese, korean.
  - name: country
    description: ISO-2 uppercase country codes, e.g. US, GB, DE, IL.
  - name: sentiment
    description: positive, negative, or neutral.
  - name: category
    description: One of the 17 IPTC-style categories listed in the provider's agent skill.
  returns: Per result — article title, URL, publish date, and the matching text excerpt.
clients_documented:
- Cursor
- Claude Desktop
- Claude Code
- Claude.ai (custom connector, OAuth)
- ChatGPT (custom connector, OAuth)
install_examples:
  claude_code: 'claude mcp add --transport http webz-news-search https://news-search-mcp.webz.io/mcp --header
    "Authorization: Bearer YOUR_WEBZ_TOKEN"'
  mcp_json: "{\n  \"mcpServers\": {\n    \"webz-news-search\": {\n      \"url\": \"https://news-search-mcp.webz.io/mcp\"\
    ,\n      \"headers\": { \"Authorization\": \"Bearer YOUR_WEBZ_TOKEN\" }\n    }\n  }\n}\n"
