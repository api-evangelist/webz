data_coverage_windows:
  note: Retention/history limits are a lifecycle fact for a data API — these are the published windows.
  news_blogs_forums: 31 days by default; longer with allowNewsHistory at extra credit cost
  segmentation: 31 days maximum; allowNewsHistory does not apply
  cyber: 2-year history cap
  data_breaches: 365 days by default; raw=true lifts the one-year limit under a restricted parameter set
  news_search: 7 days by default, up to 30 via days, or the full window via allow_all_dates
  archive: 5 years back via the API; data dumps reach back to 2008
  archive_download_link_validity: 7 days
